<header class="site-header">
  <div class="header-inner">
    <a class="site-title" href="/" aria-label="Dog Friendly DG home">
      <img src="/assets/images/logo.svg"
          alt="Dog Friendly DG - Dumfries and Galloway"
          width="180" height="60"
          loading="eager">
    </a>
    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="site-nav">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <nav class="site-nav" id="site-nav" aria-label="Main navigation">
      <a href="/walks/">Walks</a>
      <a href="/pubs-cafes/">Pubs &amp; Cafes</a>
      <a href="/beaches/">Beaches</a>
      <a href="/attractions/">Attractions</a>
      <a href="/accommodation/">Accommodation</a>
      <a href="/vets-groomers/">Vets &amp; Groomers</a>
      <a href="/events/">Events</a>
      <a href="/listings/">All Places</a>
    </nav>
  </div>
</header>

<style>
  .nav-toggle {
    display: none;
    flex-direction: column;
    gap: 5px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0.5rem;
    margin-left: auto;
  }
  .nav-toggle span {
    display: block;
    width: 24px;
    height: 2px;
    background: var(--white);
    transition: 0.25s;
  }

  @media (max-width: 640px) {
    .nav-toggle {
      display: flex;
    }
    .site-nav {
      display: none;
      flex-direction: column;
      width: 100%;
      padding: 0.5rem 0;
      order: 3;
    }
    .site-nav.open {
      display: flex;
    }
    .site-nav a {
      padding: 0.6rem 0.75rem;
      border-radius: 4px;
    }
  }
</style>

<script>
  (function() {
    var toggle = document.querySelector('.nav-toggle');
    var nav = document.querySelector('site-nav');
    if (toggle && nav) {
      toggle.addEventListener('click', function() {
        var open = nav.classList.toggle('open');
        toggle.setAttribute('aria-expanded', open);
      });
    }
  })();
</script>
