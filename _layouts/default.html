<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  {% seo %}
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-dark:   #2d5016;
      --green-mid:    #4a7c2f;
      --green-light:  #7ab648;
      --earth:        #8b6914;
      --cream:        #f9f6ee;
      --sand:         #e8e0cc;
      --text:         #2c2c2c;
      --text-light:   #555;
      --white:        #ffffff;
      --border:       #d4cdb8;
      --radius:       8px;
      --shadow:       0 2px 8px rgba(0,0,0,0.10);
    }

    body {
      font-family: Georgia, 'Times New Roman', serif;
      color: var(--text);
      background: var(--cream);
      line-height: 1.7;
      font-size: 17px;
    }

    a { color: var(--green-mid); text-decoration: none; }
    a:hover { color: var(--green-dark); text-decoration: underline; }

    /* -- HEADER -- */
    .site-header {
      background: var(--green-dark);
      color: var(--white);
      padding: 0;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }
    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
      min-height: 60px;
    }
    .site-title {
      font-size: 1.35rem;
      font-weight: bold;
      color: var(--white);
      letter-spacing: 0.02em;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.75rem 0;
    }
    .site-title:hover { color: var(--green-light); text-decoration: none; }
    .site-title .paw { font-size: 1.5rem; }

    .site-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.15rem;
      align-items: center;
    }
    .site-nav a {
      color: rgba(255,255,255,0.88);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      padding: 0.45rem 0.7rem;
      border-radius: var(--radius);
      text-decoration: none;
      transition: background 0.15s, color 0.15s;
    }
    .site-nav a:hover {
      background: var(--green-mid);
      color: var(--white);
      text-decoration: none;
    }
    .site-nav a.nav-cta {
      background: var(--green-mid);
      color: var(--white);
      border: 1px solid var(--green-light);
    }
    .site-nav a.nav-cta:hover {
      background: var(--green-light);
      color: var(--green-dark);
    }

    /* -- MAIN -- */
    .page-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.25rem 3rem;
    }

    /* -- FOOTER -- */
    .site-footer {
      background: var(--green-dark);
      color: rgba(255,255,255,0.75);
      text-align: center;
      padding: 2rem 1.25rem;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.85rem;
    }
    .site-footer .tagline {
      color: var(--green-light);
      font-style: italic;
      margin-bottom: 0.5rem;
      font-size: 1rem;
    }
    .site-footer a { color: rgba(255,255,255,0.75); }
    .site-footer a:hover { color: var(--white); }

    /* -- UTILITY -- */
    .badge {
      display: inline-block;
      padding: 0.2rem 0.65rem;
      border-radius: 99px;
      font-size: 0.78rem;
      font-weight: 700;
      font-family: Arial, Helvetica, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .badge-walk        { background: #d4edda; color: #1a5c2a; }
    .badge-pub-cafe    { background: #fff3cd; color: #7a5000; }
    .badge-beach       { background: #cce5ff; color: #004085; }
    .badge-accommodation { background: #f8d7da; color: #721c24; }
    .badge-vet-groomer { background: #e2d9f3; color: #432874; }
    .badge-event       { background: #fde8d8; color: #7a3300; }
    .badge-attraction  { background: #d6eaf8; color: #1a4971; }

    .btn {
      display: inline-block;
      padding: 0.55rem 1.2rem;
      border-radius: var(--radius);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s, transform 0.1s;
    }
    .btn:hover { transform: translateY(-1px); text-decoration: none; }
    .btn-primary { background: var(--green-mid); color: var(--white); }
    .btn-primary:hover { background: var(--green-dark); color: var(--white); }
    .btn-outline { background: transparent; color: var(--green-mid); border: 2px solid var(--green-mid); }
    .btn-outline:hover { background: var(--green-mid); color: var(--white); }

    /* -- RESPONSIVE -- */
    @media (max-width: 640px) {
      .header-inner { padding: 0 0.75rem; }
      .site-nav a { padding: 0.35rem 0.5rem; font-size: 0.78rem; }
      .page-wrap { padding: 1.25rem 0.75rem 2.5rem; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a class="site-title" href="/">
        <span class="paw">&#x1F43E;</span> Dog Friendly DG
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="/walks/">Walks</a>
        <a href="/pubs-cafes/">Pubs &amp; Cafes</a>
        <a href="/beaches/">Beaches</a>
        <a href="/accommodation/">Accommodation</a>
        <a href="/vets-groomers/">Vets &amp; Groomers</a>
        <a href="/events/">Events</a>
      </nav>
    </div>
  </header>

  <main class="page-wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p class="tagline">Scotland's dog-friendly Dumfries and Galloway guide</p>
    <p>&copy; {{ 'now' | date: "%Y" }} Dog Friendly DG &mdash;
      <a href="/walks/">Walks</a> &middot;
      <a href="/beaches/">Beaches</a> &middot;
      <a href="/accommodation/">Accommodation</a>
    </p>
  </footer>

</body>
</html>
